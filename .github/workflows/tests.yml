name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Daily data commits made by the trading workflow do not need a test run.
    if: ${{ !startsWith(github.event.head_commit.message, 'auto:') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Check that every module imports
        run: |
          python -c "import importlib; [importlib.import_module(m) for m in ['trend_strategy','thematic_sleeve','risk_management','performance_metrics','raam_replication','daily_execution','short_horizon_study','legacy.walk_forward','legacy.ml_strategy','legacy.backtester']]"

      - name: Run tests
        run: python -m pytest
